# .github/workflows/ci.yml
# Joby lecą WYŁĄCZNIE na self-hosted runnerze ihub, W OSOBNYM KONTENERZE Dockera.
# Kontener wstaje na czas joba i jest usuwany po zakończeniu — nie używaj systemowego Pythona hosta.
# Zalecany obraz: python:3.11-slim-bookworm (jest też 3.12-slim-bookworm).

name: CI/CD Pipeline for ML Model Training

on:
  push:
    branches:
      - main

jobs:
  train-model:
    runs-on: [self-hosted, linux, ihub]
    timeout-minutes: 30

    # Izolowane środowisko — tu student konfiguruje Pythona/venv/pip bez PEP 668 z hosta.
    # Wersję Pythona zmieniasz sam: podmień tag obrazu poniżej (np. python:3.12-slim-bookworm).
    # Na ihub są już 3.11 i 3.12; inny tag z Docker Huba też zadziała (pierwszy pull może potrwać dłużej).
    container:
      image: python:3.11-slim-bookworm

    steps:
      # Krok 1: Checkout repozytorium

      # Krok 2: Zainstaluj zależności (w kontenerze możesz użyć venv), np.:
      #   - run: |
      #       python -m venv .venv
      #       . .venv/bin/activate
      #       pip install -U pip
      #       pip install -r requirements.txt

      # Krok 3: Uruchom trenowanie modelu

      # Krok 4: Wyświetl wynik (accuracy)
      - name: Display training result
        run: cat accuracy.txt
